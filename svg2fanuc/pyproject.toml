[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svg2fanuc"
version = "0.1.0"
description = "Convert a cleaned SVG line drawing into a FANUC .LS program (project 'Линия индустрии')"
requires-python = ">=3.12"
dependencies = [
    "svgelements==1.9.6",
    "defusedxml==0.7.1",
    "PyYAML==6.0.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
svg2fanuc = "svg2fanuc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
