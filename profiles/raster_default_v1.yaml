schema_version: 1
profile_id: raster_default_v1

image:
  upscale_min_short_side: 900
  otsu: true
  adaptive: false
  adaptive_block_size: 35
  adaptive_offset: 5.0
  remove_small_objects_px: 20
  bridge_gap_px: 1

skeleton:
  engine: skeleton
  method: auto
  spur_len_px: 12
  node_merge_dist_px: 4
  collinear_deg: 4
  smooth_chaikin_iterations: 0

simplify:
  tolerance_vb: 0.8
  dedupe_epsilon_vb: 0.05
  max_length_loss_ratio: 0.03

paths:
  merge_tol_vb: 0.5
  min_stroke_len_vb: 2.0
  linesort_two_opt: true
  reloop: true

fills:
  enabled: false
  fill_area_px: 4000
  hatch_pitch_vb: 3.0
  hatch_angle_deg: 45

output:
  emit_ids: true
  stroke_width: 1
  decimal_places: 2
  verify_with_svg2fanuc: false

limits:
  max_input_bytes: 33554432
  max_image_pixels: 40000000
  max_strokes: 20000
  max_points: 400000

